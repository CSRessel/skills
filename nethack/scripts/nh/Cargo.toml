[package]
name = "nh"
version = "0.1.0"
edition = "2024"
description = "Compact, safe interface to a NetHack tmux session"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
