<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="data:," />
    <title>Plan</title>
    <style>
      /* Shared repo palette — see THEME.md. Two variants, one vocabulary:
         paper is black on warm paper drawn in charcoal, carbon is white on
         black drawn in green. Each variant is dichromatic; nothing introduces
         a third hue except --danger, which reports failure. The page follows
         the OS setting, and ?theme= overrides it. */
      :root,
      :root[data-theme="paper"] {
        color-scheme: light;
        --canvas: #ece6d8;
        --panel: #e7e0d0;
        --raised: #d9d1bf;
        --rule: #b7ad99;
        --ink: #1f1c18;
        --muted-ink: #5a564f;
        --faint: #a09c94;
        --accent: #26231e;
        --accent-ink: #f4efe3;
        --danger: #da1e28;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      :root[data-theme="carbon"] {
        color-scheme: dark;
        --canvas: #161616;
        --panel: #1c1c1c;
        --raised: #262626;
        --rule: #393939;
        --ink: #dde1e6;
        --muted-ink: #8a8f98;
        --faint: #4a4a4a;
        --accent: #42be65;
        --accent-ink: #0e0e0e;
        --danger: #f47067;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --canvas: #161616;
          --panel: #1c1c1c;
          --raised: #262626;
          --rule: #393939;
          --ink: #dde1e6;
          --muted-ink: #8a8f98;
          --faint: #4a4a4a;
          --accent: #42be65;
          --accent-ink: #0e0e0e;
          --danger: #f47067;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        line-height: 1.65;
      }

      button,
      code,
      pre {
        font: inherit;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3.5rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--rule);
        background: var(--canvas);
      }

      .toolbar-title {
        min-width: 0;
      }

      .toolbar-title strong,
      .toolbar-title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toolbar-title span {
        color: var(--muted-ink);
        font-size: 0.78rem;
      }

      .toolbar-actions {
        display: flex;
        gap: 0.5rem;
      }

      button {
        padding: 0.45rem 0.75rem;
        border: 1px solid var(--rule);
        border-radius: 0.45rem;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }

      button:hover {
        background: var(--raised);
        border-color: var(--ink);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(12rem, 16rem) minmax(0, 1fr);
        gap: 2rem;
        width: min(100%, 92rem);
        margin: 0 auto;
        padding: 2rem;
      }

      .toc {
        position: sticky;
        top: 5.5rem;
        align-self: start;
        max-height: calc(100vh - 7rem);
        overflow: auto;
        padding: 1rem;
        border: 1px solid var(--rule);
        border-radius: 0.65rem;
        background: var(--panel);
      }

      /* The ToC heading is an h2 and would otherwise inherit the section
         divider rule below, drawing a stray line inside the box. */
      .toc h2 {
        margin: 0 0 0.75rem;
        padding-top: 0;
        border-top: 0;
        color: var(--muted-ink);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .toc ol {
        display: grid;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc li[data-level="3"] {
        padding-left: 0.85rem;
      }

      .toc a {
        color: var(--muted-ink);
        font-size: 0.86rem;
        text-decoration: none;
      }

      .toc a:hover {
        color: var(--ink);
        text-decoration: underline;
      }

      main {
        min-width: 0;
      }

      article {
        width: min(100%, 58rem);
        min-height: 60vh;
        margin: 0 auto;
        padding: clamp(1.5rem, 4vw, 4rem);
        border: 1px solid var(--rule);
        border-radius: 0.75rem;
        background: var(--canvas);
      }

      article > :first-child {
        margin-top: 0;
      }

      h1,
      h2,
      h3 {
        line-height: 1.2;
        scroll-margin-top: 5rem;
      }

      h1 {
        margin-bottom: 1.5rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      h2 {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--rule);
        font-size: 1.55rem;
      }

      h3 {
        margin-top: 2rem;
        font-size: 1.15rem;
      }

      /* Paper has no coloured accent, so a link cannot be marked by colour
         alone. Both variants underline. */
      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.15em;
      }

      blockquote {
        margin: 1.5rem 0;
        padding: 0.8rem 1rem;
        border-left: 0.25rem solid var(--accent);
        background: var(--panel);
      }

      blockquote > :first-child {
        margin-top: 0;
      }

      blockquote > :last-child {
        margin-bottom: 0;
      }

      code {
        padding: 0.12rem 0.3rem;
        border-radius: 0.25rem;
        background: var(--raised);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.88em;
      }

      pre {
        max-width: 100%;
        overflow: auto;
        padding: 1rem;
        border: 1px solid var(--rule);
        border-radius: 0.55rem;
        background: var(--panel);
      }

      pre code {
        padding: 0;
        background: transparent;
      }

      table {
        display: block;
        width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--rule);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--raised);
      }

      img,
      svg {
        max-width: 100%;
        height: auto;
      }

      .mermaid {
        margin: 2rem 0;
        overflow-x: auto;
        padding: 1rem;
        border: 1px solid var(--rule);
        border-radius: 0.55rem;
        background: var(--panel);
        text-align: center;
      }

      .error {
        padding: 1rem;
        border: 1px solid var(--danger);
        border-radius: 0.5rem;
        background: var(--panel);
        color: var(--danger);
        white-space: pre-wrap;
      }

      @media (max-width: 760px) {
        .layout {
          display: block;
          padding: 1rem;
        }

        .toc {
          position: static;
          max-height: none;
          margin-bottom: 1rem;
        }

        article {
          padding: 1.25rem;
        }

        .toolbar {
          align-items: flex-start;
        }
      }

      /* Print is the one place that is neither variant: real paper is white,
         and charcoal on warm paper wastes ink. */
      @media print {
        :root,
        :root[data-theme="paper"],
        :root[data-theme="carbon"] {
          color-scheme: light;
          --canvas: #fff;
          --panel: #fff;
          --raised: #f5f5f5;
          --rule: #ccc;
          --ink: #111;
          --muted-ink: #555;
          --accent: #111;
        }

        .toolbar,
        .toc {
          display: none;
        }

        .layout {
          display: block;
          width: auto;
          padding: 0;
        }

        article {
          width: auto;
          padding: 0;
          border: 0;
        }

        a {
          color: inherit;
        }

        pre,
        table,
        .mermaid {
          break-inside: avoid;
        }

        /* Mermaid bakes the active variant into the SVG when it renders, so a
           carbon diagram would otherwise print as a solid black block. Repaint
           it: an !important author rule beats Mermaid's own inline styles and
           its injected stylesheet. */
        .mermaid,
        .mermaid svg {
          background: #fff !important;
        }

        .mermaid svg rect,
        .mermaid svg polygon,
        .mermaid svg circle,
        .mermaid svg ellipse {
          fill: #fff !important;
          stroke: #111 !important;
        }

        .mermaid svg text,
        .mermaid svg tspan,
        .mermaid svg .nodeLabel,
        .mermaid svg .edgeLabel,
        .mermaid svg .messageText,
        .mermaid svg .loopText {
          fill: #111 !important;
          color: #111 !important;
        }

        .mermaid svg path,
        .mermaid svg line {
          stroke: #111 !important;
        }

        .mermaid svg .edgePath path,
        .mermaid svg path.messageLine0,
        .mermaid svg path.messageLine1 {
          fill: none !important;
        }

        .mermaid svg marker path,
        .mermaid svg marker polygon {
          fill: #111 !important;
        }

        .mermaid svg .edgeLabel rect,
        .mermaid svg .labelBkg {
          fill: #fff !important;
          stroke: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-title">
        <strong id="document-title">Plan</strong>
        <span id="source-path"></span>
      </div>
      <div class="toolbar-actions">
        <button id="reload" type="button">Reload</button>
        <button id="print" type="button">Print</button>
      </div>
    </header>

    <div class="layout">
      <nav class="toc" aria-label="Table of contents">
        <h2>Contents</h2>
        <ol id="toc"></ol>
      </nav>
      <main>
        <article id="plan" aria-live="polite">Loading plan…</article>
      </main>
    </div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
