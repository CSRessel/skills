<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" href="data:," />
    <title>Plan</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f7f7f5;
        --surface: #ffffff;
        --surface-muted: #f0f0ed;
        --text: #20201e;
        --muted: #666660;
        --border: #d8d8d2;
        --accent: #2866d7;
        --accent-soft: #e8effd;
        --code: #f1f1ee;
        --shadow: 0 12px 40px rgb(25 25 20 / 8%);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #171715;
          --surface: #20201e;
          --surface-muted: #292926;
          --text: #eeeeea;
          --muted: #aaa9a1;
          --border: #3b3b36;
          --accent: #8bb4ff;
          --accent-soft: #233657;
          --code: #292926;
          --shadow: 0 12px 40px rgb(0 0 0 / 28%);
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        line-height: 1.65;
      }

      button,
      code,
      pre {
        font: inherit;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3.5rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: blur(12px);
      }

      .toolbar-title {
        min-width: 0;
      }

      .toolbar-title strong,
      .toolbar-title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toolbar-title span {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .toolbar-actions {
        display: flex;
        gap: 0.5rem;
      }

      button {
        padding: 0.45rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 0.45rem;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(12rem, 16rem) minmax(0, 1fr);
        gap: 2rem;
        width: min(100%, 92rem);
        margin: 0 auto;
        padding: 2rem;
      }

      .toc {
        position: sticky;
        top: 5.5rem;
        align-self: start;
        max-height: calc(100vh - 7rem);
        overflow: auto;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.65rem;
        background: var(--surface);
      }

      .toc h2 {
        margin: 0 0 0.75rem;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .toc ol {
        display: grid;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc li[data-level="3"] {
        padding-left: 0.85rem;
      }

      .toc a {
        color: var(--muted);
        font-size: 0.86rem;
        text-decoration: none;
      }

      .toc a:hover {
        color: var(--accent);
      }

      main {
        min-width: 0;
      }

      article {
        width: min(100%, 58rem);
        min-height: 60vh;
        margin: 0 auto;
        padding: clamp(1.5rem, 4vw, 4rem);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      article > :first-child {
        margin-top: 0;
      }

      h1,
      h2,
      h3 {
        line-height: 1.2;
        scroll-margin-top: 5rem;
      }

      h1 {
        margin-bottom: 1.5rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      h2 {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        font-size: 1.55rem;
      }

      h3 {
        margin-top: 2rem;
        font-size: 1.15rem;
      }

      a {
        color: var(--accent);
      }

      blockquote {
        margin: 1.5rem 0;
        padding: 0.8rem 1rem;
        border-left: 0.25rem solid var(--accent);
        background: var(--accent-soft);
      }

      blockquote > :first-child {
        margin-top: 0;
      }

      blockquote > :last-child {
        margin-bottom: 0;
      }

      code {
        padding: 0.12rem 0.3rem;
        border-radius: 0.25rem;
        background: var(--code);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.88em;
      }

      pre {
        max-width: 100%;
        overflow: auto;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.55rem;
        background: var(--code);
      }

      pre code {
        padding: 0;
        background: transparent;
      }

      table {
        display: block;
        width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--surface-muted);
      }

      img,
      svg {
        max-width: 100%;
        height: auto;
      }

      .mermaid {
        margin: 2rem 0;
        overflow-x: auto;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.55rem;
        background: var(--surface-muted);
        text-align: center;
      }

      .error {
        padding: 1rem;
        border: 1px solid #c33;
        border-radius: 0.5rem;
        background: color-mix(in srgb, #c33 12%, var(--surface));
        white-space: pre-wrap;
      }

      @media (max-width: 760px) {
        .layout {
          display: block;
          padding: 1rem;
        }

        .toc {
          position: static;
          max-height: none;
          margin-bottom: 1rem;
        }

        article {
          padding: 1.25rem;
        }

        .toolbar {
          align-items: flex-start;
        }
      }

      @media print {
        :root {
          --background: #fff;
          --surface: #fff;
          --text: #111;
          --muted: #555;
          --border: #ccc;
          --code: #f5f5f5;
        }

        .toolbar,
        .toc {
          display: none;
        }

        .layout {
          display: block;
          width: auto;
          padding: 0;
        }

        article {
          width: auto;
          padding: 0;
          border: 0;
          box-shadow: none;
        }

        a {
          color: inherit;
        }

        pre,
        table,
        .mermaid {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-title">
        <strong id="document-title">Plan</strong>
        <span id="source-path"></span>
      </div>
      <div class="toolbar-actions">
        <button id="reload" type="button">Reload</button>
        <button id="print" type="button">Print</button>
      </div>
    </header>

    <div class="layout">
      <nav class="toc" aria-label="Table of contents">
        <h2>Contents</h2>
        <ol id="toc"></ol>
      </nav>
      <main>
        <article id="plan" aria-live="polite">Loading plan…</article>
      </main>
    </div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
