<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Card review</title>
<style>
  :root {
    --canvas: #f2f4f8; --sheet: #ffffff; --nested: #f2f4f8; --hairline: #dde1e6; --strong: #c1c7cd;
    --muted: #8a8f98; --comment: #525252; --text: #393939; --fg: #161616;
    --green: #24a148; --green-ink: #198038; --green-tint: rgba(36,161,72,.09);
    --red: #da1e28; --red-ink: #da1e28; --red-tint: rgba(218,30,40,.08);
    --shadow: 0 1px 2px rgba(22,22,22,.06), 0 12px 32px rgba(22,22,22,.08);
    --on-green: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #161616; --sheet: #1c1c1c; --nested: #262626; --hairline: #262626; --strong: #393939;
      --muted: #525252; --comment: #8a8f98; --text: #dde1e6; --fg: #f2f4f8;
      --green: #42be65; --green-ink: #6fdc8c; --green-tint: rgba(66,190,101,.12);
      --red: #f47067; --red-ink: #ff9cac; --red-tint: rgba(244,112,103,.12);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35);
      --on-green: #161616;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { height: 100dvh; }
  body {
    background: var(--canvas); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Inter", "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center;
    height: 100dvh; overflow: hidden;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
  }
  header { width: 100%; max-width: 560px; margin-bottom: 18px; flex: none; }
  h1 { font-size: 17px; font-weight: 600; color: var(--fg); margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: var(--comment); font-size: 13px; margin: 0; }
  .progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .bar { flex: 1; height: 4px; background: var(--hairline); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .3s ease; }
  .count { font-size: 12px; color: var(--comment); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

  main { width: 100%; max-width: 560px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* The stack takes all space left above the controls, so every card has the same height
     and the controls never move. Room at the bottom shows the edges of the next cards. */
  .stack { position: relative; flex: 1 1 auto; min-height: 240px; max-height: 540px; margin-bottom: 30px; }
  .card {
    position: absolute; inset: 0; background: var(--sheet); border: 1px solid var(--hairline);
    border-radius: 16px; box-shadow: var(--shadow); padding: 26px 26px 0;
    display: flex; flex-direction: column; overflow: hidden;
    touch-action: pan-y; user-select: none; cursor: grab; will-change: transform;
    transform-origin: 50% 100%;
  }
  .card-body { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 22px; overscroll-behavior: contain;
    mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
  .card.dragging { cursor: grabbing; transition: none !important; }
  .card.behind { pointer-events: none; border-color: var(--strong); box-shadow: 0 2px 4px rgba(0,0,0,.12); }
  .card.behind > * { visibility: hidden; }
  .card.d2 { background: color-mix(in srgb, var(--sheet) 88%, var(--canvas)); }
  .card.d3 { background: color-mix(in srgb, var(--sheet) 76%, var(--canvas)); }
  .card.d1 { z-index: 1; transform: translateY(10px) scale(.96); }
  .card.d2 { z-index: 0; transform: translateY(20px) scale(.92); }
  .card.d3 { z-index: -1; transform: translateY(30px) scale(.88); }
  .card.d1, .card.d2, .card.d3 { transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .card.top { z-index: 2; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s; }
  .card.fan { pointer-events: none; transform-origin: 50% 170%; transition: none; }
  .card.fan.blank > * { visibility: hidden; }
  .stack.fanning > .card:not(.fan) { visibility: hidden; }
  .controls { flex: none; position: relative; z-index: 20; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--comment); margin: 0 0 10px; }
  .card h2 { font-size: 22px; line-height: 1.3; font-weight: 600; color: var(--fg); margin: 0 0 14px; letter-spacing: -.015em; }
  .desc { margin: 0 0 20px; color: var(--text); }
  .desc p, .rec .body p { margin: 0 0 10px; }
  .desc p:last-child, .rec .body p:last-child { margin-bottom: 0; }
  .desc ol, .desc ul, .rec .body ol, .rec .body ul { margin: 0 0 10px; padding-left: 26px; }
  .desc ol.opts { list-style: none; padding-left: 4px; }
  .desc li, .rec .body li { margin: 0 0 8px; }
  .desc ol.opts li .ol { font-weight: 600; margin-right: 6px; }
  .rec { border-radius: 10px; background: var(--nested); border: 1px solid var(--hairline); padding: 12px 14px; }
  .rec .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--comment); margin-bottom: 4px; }
  .rec p { margin: 0; color: var(--fg); }
  code { font: 0.9em ui-monospace, "IBM Plex Mono", SFMono-Regular, Menlo, monospace; background: var(--nested); border: 1px solid var(--hairline); padding: 0 4px; border-radius: 4px; }
  .rec code { background: var(--sheet); }
  .prev { margin-top: 12px; font-size: 12px; color: var(--comment); }

  .stamp {
    position: absolute; top: 18px; padding: 4px 10px; border-radius: 6px; border: 2px solid; font-weight: 700;
    font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: 0; pointer-events: none;
  }
  .stamp.agree { left: 18px; color: var(--green-ink); border-color: var(--green); background: var(--green-tint); transform: rotate(-8deg); }
  .stamp.disagree { right: 18px; color: var(--red-ink); border-color: var(--red); background: var(--red-tint); transform: rotate(8deg); }

  .note { margin-top: 0; }
  .note textarea {
    width: 100%; min-height: 44px; max-height: 120px; resize: none; display: block; background: var(--sheet); color: var(--fg);
    border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; outline: none;
  }
  .note textarea::placeholder { color: var(--muted); }
  .note textarea:focus { border-color: var(--strong); }

  .actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-top: 14px; }
  button {
    font: inherit; font-size: 14px; font-weight: 500; border-radius: 10px; padding: 11px 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--hairline);
    background: var(--sheet); color: var(--fg); transition: background .15s, border-color .15s, transform .08s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: default; }
  button.disagree:hover { border-color: var(--red); background: var(--red-tint); }
  button.ghost { color: var(--comment); }
  button.ghost:hover { background: var(--nested); }
  button.agree { background: var(--green); border-color: var(--green); color: var(--on-green); }
  button.agree:hover { filter: brightness(1.06); }
  kbd {
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 20px; padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--strong); color: var(--comment); background: var(--canvas); line-height: 16px; text-align: center;
  }
  button.agree kbd { border-color: currentColor; color: inherit; background: transparent; opacity: .8; }
  .hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 14px; font-size: 12px; color: var(--comment); }
  .hints span { display: inline-flex; align-items: center; gap: 6px; }
  @media (hover: none) { .hints, button kbd { display: none; } }

  @media (max-width: 640px) {
    body { padding-top: 14px; }
    header { margin-bottom: 12px; }
    .stack { max-height: none; }
    .card { padding: 20px 20px 0; }
    .card h2 { font-size: 20px; }
  }
  .done { overflow-y: auto; background: var(--sheet); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; }
  .done h2 { margin: 0 0 4px; font-size: 20px; color: var(--fg); }
  .done .sub { margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--hairline); cursor: pointer; }
  .row:hover .rt { text-decoration: underline; text-decoration-color: var(--strong); }
  .chip { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; align-self: start; margin-top: 2px; }
  .chip.agree { color: var(--green-ink); background: var(--green-tint); }
  .chip.disagree { color: var(--red-ink); background: var(--red-tint); }
  .chip.skip { color: var(--comment); background: var(--nested); }
  .rt { color: var(--fg); }
  .rn { grid-column: 2; font-size: 13px; color: var(--comment); white-space: pre-wrap; }
  .saved { font-size: 12px; color: var(--comment); margin-top: 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--canvas); font-size: 13px; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<header>
  <h1 id="title">Loading…</h1>
  <p class="sub" id="subtitle"></p>
  <div class="progress"><div class="bar"><i id="bar"></i></div><span class="count" id="count"></span></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

const rich = (s) => {
  const out = [];
  for (const para of String(s ?? '').split(/\n\s*\n/)) {
    const lines = para.split('\n');
    const head = [], opts = [], bullets = [];
    for (const l of lines) {
      const m = l.match(/^\s*\(([a-z])\)\s*(.*)$/);
      const b = l.match(/^\s*[-*]\s+(.*)$/);
      if (m) opts.push([m[1], m[2]]);
      else if (b) bullets.push(b[1]);
      else if (opts.length) opts[opts.length - 1][1] += ' ' + l;
      else if (bullets.length) bullets[bullets.length - 1] += ' ' + l;
      else head.push(l);
    }
    if (head.join('').trim()) out.push(`<p>${inline(head.join(' '))}</p>`);
    if (bullets.length) out.push(`<ul>${bullets.map((b) => `<li>${inline(b)}</li>`).join('')}</ul>`);
    if (opts.length) out.push(`<ol class="opts">${opts.map(([k, t]) => `<li><span class="ol">${k}.</span>${inline(t)}</li>`).join('')}</ol>`);
  }
  return out.join('');
};

let deck = { items: [] };
let answers = {};
let index = 0;
const history = []; // [{index, id, previous}]
let notes = {};     // draft notes per id

const state = () => deck.items;
const answeredCount = () => state().filter((it) => answers[it.id]).length;

async function load() {
  const [d, a] = await Promise.all([fetch('api/deck').then((r) => r.json()), fetch('api/answers').then((r) => r.json())]);
  deck = d; answers = a.answers ?? {};
  for (const [id, ans] of Object.entries(answers)) notes[id] = ans.note ?? '';
  document.title = deck.title ?? 'Card review';
  $('#title').textContent = deck.title ?? 'Card review';
  $('#subtitle').textContent = deck.subtitle ?? '';
  index = state().findIndex((it) => !answers[it.id]);
  if (index < 0) index = state().length;
  render();
}

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await fetch('api/answers', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ answers }) });
    const s = $('#saved'); if (s) s.textContent = 'Saved ' + new Date().toLocaleTimeString();
  }, 150);
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400);
}

function progress() {
  const n = state().length, done = answeredCount();
  $('#bar').style.width = n ? (done / n * 100) + '%' : '0';
  $('#count').textContent = `${Math.min(index + 1, n)} / ${n}`;
}

function cardHtml(it, i, cls) {
  const prev = answers[it.id];
  return `<article class="card ${cls}" data-i="${i}" ${cls === 'top' ? 'tabindex="0" aria-live="polite"' : 'aria-hidden="true"'}>
    <span class="stamp agree">${esc(deck.agreeLabel ?? 'Agree')}</span>
    <span class="stamp disagree">${esc(deck.disagreeLabel ?? 'Disagree')}</span>
    <div class="card-body">
    <p class="eyebrow">${esc(it.eyebrow ?? `Question ${i + 1} of ${state().length}`)}</p>
    <h2>${inline(it.title)}</h2>
    <div class="desc">${rich(it.description)}</div>
    ${it.recommendation ? `<div class="rec"><div class="label">Recommendation</div><div class="body">${rich(it.recommendation)}</div></div>` : ''}
    ${prev ? `<p class="prev">Previously: ${prev.decision}</p>` : ''}
    </div>
  </article>`;
}

function render() {
  stopFan();
  progress();
  const items = state();
  const main = $('#main');
  if (index >= items.length) return renderDone();
  const it = items[index];
  // Up to 3 card edges peek out below the current card.
  const depth = Math.min(3, items.length - index - 1);
  const behind = Array.from({ length: depth }, (_, k) => depth - k)
    .map((d) => `<article class="card behind d${d}" aria-hidden="true"></article>`).join('');
  main.innerHTML = `
    <div class="stack">${behind}${cardHtml(it, index, 'top')}</div>
    <div class="controls">
    <div class="note"><textarea id="note" rows="1" placeholder="Add a note (↵)…">${esc(notes[it.id] ?? '')}</textarea></div>
    <div class="actions">
      <button class="disagree" id="no"><kbd>←</kbd> ${esc(deck.disagreeLabel ?? 'Disagree')}</button>
      <button class="ghost" id="undo" ${history.length ? '' : 'disabled'}><kbd>U</kbd> Undo</button>
      <button class="agree" id="yes">${esc(deck.agreeLabel ?? 'Agree')} <kbd>→</kbd></button>
    </div>
    <div class="hints">
      <span><kbd>←</kbd> ${esc((deck.disagreeLabel ?? 'Disagree').toLowerCase())}</span>
      <span><kbd>→</kbd> ${esc((deck.agreeLabel ?? 'Agree').toLowerCase())}</span>
      <span><kbd>U</kbd> undo</span>
      <span><kbd>↵</kbd> note</span>
      <span><kbd>Esc</kbd> leave note</span>
    </div>
    </div>`;
  const top = $('.card.top');
  const note = $('#note');
  note.addEventListener('input', () => { notes[it.id] = note.value; autosize(note); });
  autosize(note);
  $('#no').onclick = () => commit('disagree');
  $('#yes').onclick = () => commit('agree');
  $('#undo').onclick = undo;
  bindDrag(top);
}

function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(120, Math.max(44, t.scrollHeight + 2)) + 'px'; }

function renderDone() {
  const items = state();
  const agree = items.filter((it) => answers[it.id]?.decision === 'agree').length;
  const disagree = items.filter((it) => answers[it.id]?.decision === 'disagree').length;
  $('#count').textContent = `${items.length} / ${items.length}`;
  $('#main').innerHTML = `<section class="done">
    <h2>All done</h2>
    <p class="sub">${agree} agreed · ${disagree} disagreed. Click a row to change it. Press <kbd>U</kbd> to undo the last one.</p>
    ${items.map((it, i) => {
      const a = answers[it.id];
      const d = a?.decision ?? 'skip';
      return `<div class="row" data-i="${i}"><span class="chip ${d}">${d === 'skip' ? 'open' : esc(d)}</span>
        <span class="rt">${inline(it.title)}</span>${a?.note ? `<span class="rn">${esc(a.note)}</span>` : ''}</div>`;
    }).join('')}
    <p class="saved" id="saved">Answers are saved on the server as you go.</p>
  </section>`;
  document.querySelectorAll('.row').forEach((r) => r.onclick = () => { index = Number(r.dataset.i); render(); });
}

function commit(decision) {
  stopFan();
  const items = state();
  if (index >= items.length) return;
  const it = items[index];
  const top = $('.card.top');
  history.push({ index, id: it.id, previous: answers[it.id] ?? null });
  answers[it.id] = { decision, note: (notes[it.id] ?? '').trim(), at: new Date().toISOString() };
  save();
  const dir = decision === 'agree' ? 1 : -1;
  if (top) {
    top.classList.remove('dragging');
    top.style.transform = `translateX(${dir * 140}%) rotate(${dir * 14}deg)`;
    top.style.opacity = '0';
    $(`.stamp.${decision}`, top).style.opacity = '1';
  }
  document.querySelectorAll('.card.behind').forEach((c) => {
    const d = Number(c.className.match(/d(\d)/)[1]);
    c.style.transform = d === 1 ? 'none' : `translateY(${(d - 1) * 10}px) scale(${1 - (d - 1) * 0.04})`;
  });
  setTimeout(() => {
    // Advance to the next unanswered card after this one, else the end.
    let n = items.findIndex((x, i) => i > index && !answers[x.id]);
    index = n < 0 ? items.length : n;
    render();
  }, 240);
}

function undo() {
  const last = history.pop();
  if (!last) return;
  if (last.previous) answers[last.id] = last.previous; else delete answers[last.id];
  index = last.index;
  save(); render(); toast('Undone');
}

function bindDrag(card) {
  let start = null, horizontal = null, dx = 0;
  const width = () => card.offsetWidth || 340;
  const setStamps = (x) => {
    const p = Math.min(1, Math.abs(x) / (width() * 0.35));
    $('.stamp.agree', card).style.opacity = x > 0 ? p : 0;
    $('.stamp.disagree', card).style.opacity = x < 0 ? p : 0;
  };
  card.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('a')) return;
    stopFan();
    start = { x: e.clientX, y: e.clientY, t: performance.now() }; horizontal = null; dx = 0; card.setPointerCapture?.(e.pointerId);
  });
  card.addEventListener('pointermove', (e) => {
    if (!start) return;
    const x = e.clientX - start.x, y = e.clientY - start.y;
    if (horizontal == null) {
      if (Math.hypot(x, y) <= 10) return;
      horizontal = Math.abs(y) <= Math.abs(x) * Math.tan(35 * Math.PI / 180);
      if (!horizontal) { start = null; return; }
      card.classList.add('dragging'); card.setPointerCapture?.(e.pointerId);
    }
    dx = x;
    card.style.transform = `translateX(${x}px) rotate(${x / 22}deg)`;
    setStamps(x);
  });
  const end = (e) => {
    if (!start) return;
    const s = start; start = null;
    if (!horizontal) return;
    const v = dx / Math.max(1, performance.now() - s.t);
    if (Math.abs(dx) >= width() * 0.35 || Math.abs(v) >= 0.4) return commit(dx > 0 ? 'agree' : 'disagree');
    card.classList.remove('dragging'); card.style.transform = ''; setStamps(0);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

// Easter egg: `F` or a triple-click fans the deck out like a card flourish, then squares it up again.
// Uses copies of the next cards so the real top card and its handlers are never touched.
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let fanning = null;
function stopFan() {
  if (!fanning) return;
  fanning.cards.forEach((c) => c.remove());
  fanning.stack.classList.remove('fanning');
  fanning = null;
}
function fan() {
  const stack = $('.stack');
  if (!stack || fanning || reducedMotion.matches) return;
  const items = state();
  const n = 7, mid = (n - 1) / 2, spread = 10, dur = 1150;
  // Front card in the middle; the rest alternate outwards, each one deeper in the deck.
  const order = Array.from({ length: n }, (_, k) => k === 0 ? mid : mid + (k % 2 ? -1 : 1) * Math.ceil(k / 2));
  const cards = order.map((pos, k) => {
    const it = items[index + k];
    const tmp = document.createElement('div');
    tmp.innerHTML = it ? cardHtml(it, index + k, 'fan') : '<article class="card fan blank" aria-hidden="true"></article>';
    const el = tmp.firstElementChild;
    el.classList.add('fan'); el.removeAttribute('tabindex'); el.removeAttribute('aria-live'); el.setAttribute('aria-hidden', 'true');
    el.style.zIndex = String(10 + n - k);
    const rest = `translateY(${Math.min(k, 3) * 10}px) scale(${1 - Math.min(k, 3) * 0.04})`;
    const a = (pos - mid) * spread;
    const lift = -Math.abs(pos - mid) * 6 - 18;
    const out = `translateY(${lift}px) rotate(${a}deg) scale(${k === 0 ? 1.03 : 0.97})`;
    el.animate([
      { transform: rest, easing: 'cubic-bezier(.34,1.5,.64,1)' },
      { transform: out, offset: 0.38, easing: 'ease-in-out' },
      { transform: `translateY(${lift - 6}px) rotate(${a * 1.06}deg) scale(${k === 0 ? 1.03 : 0.97})`, offset: 0.62, easing: 'cubic-bezier(.55,0,.75,.2)' },
      { transform: `translateY(${Math.min(k, 3) * 10 + 6}px) scale(${1 - Math.min(k, 3) * 0.04}, ${0.97 - Math.min(k, 3) * 0.04})`, offset: 0.9, easing: 'ease-out' },
      { transform: rest },
    ], { duration: dur, delay: Math.abs(pos - mid) * 28 });
    return el;
  });
  stack.append(...cards);
  stack.classList.add('fanning');
  const me = fanning = { stack, cards };
  setTimeout(() => { if (fanning === me) stopFan(); }, dur + mid * 28 + 40);
}
document.addEventListener('click', (e) => {
  if (e.detail === 3 && e.target instanceof Element && e.target.closest('.stack')) fan();
});

const editable = (t) => t instanceof Element && t.closest('textarea, input, select, [contenteditable="true"]');
document.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.repeat || e.altKey || e.isComposing || e.keyCode === 229) return;
  if (editable(e.target)) {
    if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); }
    return;
  }
  const chord = e.ctrlKey || e.metaKey;
  if (chord) { if (!e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } return; }
  if (e.key.toLowerCase() === 'u') { e.preventDefault(); return undo(); }
  if (e.shiftKey) return;
  if (e.key.toLowerCase() === 'f') { e.preventDefault(); return fan(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); return commit('disagree'); }
  if (e.key === 'ArrowRight') { e.preventDefault(); return commit('agree'); }
  if (e.key === 'Enter' && !(e.target instanceof Element && e.target.closest('button, a[href]'))) {
    const n = $('#note'); if (n) { e.preventDefault(); n.focus(); }
  }
});

load();
</script>
</body>
